name: Release

# tag 触发：v1.8.x 这样的 tag 推上去即产出并上传安装包。
# 手工发布容易漏掉 --target-platform 与签名校验，这里固化成流程。
#
# 也支持手工触发（workflow_dispatch）：用于**只跑工具链诊断**而不发布，
# 以及在没有 tag 的情况下重跑一次发布。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      play_build:
        # Play 版（零预置 BYO）用 --dart-define=boorunova.play=true 构建，
        # 并且**必须**跑字节级禁串断言。GitHub 直装包本来就含站点模板，
        # 那份包跑这条断言必然失败，所以默认 false。
        description: '按 Play 版构建（零预置 + 字节级禁串断言）'
        required: false
        type: boolean
        default: false
      tag:
        # 必填：此前直接把 github.ref_name 当 tag 用，而手动触发时它是**分支名**，
        # 于是会创建一个叫 "main" 的 Release/tag 并标成 --latest。
        description: '要发布/重跑的 tag（如 v1.8.7）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # 门禁 + 工具链诊断。这个 job **不需要任何密钥**，因此总能跑。
  #
  # 为什么要单独一个 job：
  # 1) 没配签名 secrets 时，发布构建必然失败（还原出空的密钥文件），
  #    用户只会看到一次看不懂的红叉。这里把"有没有 secrets"变成构建 job 的
  #    开关，没配就明确跳过并给出提示。
  # 2) 依赖里 gal 写死 compileSdk 36，CI 上曾出现 ":gal 的 compileSdkVersion
  #    为 null"（flutter.groovy:929 的 substring 崩溃）而本机不复现。这类
  #    环境差异必须在这里取证，不能靠猜。
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.gate.outputs.has_secrets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.0
          channel: stable
          cache: true

      - name: 检查签名 secrets
        id: gate
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            echo "签名 secrets 已配置，将执行发布构建。"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过发布构建::未配置签名 secrets（KEYSTORE_BASE64 等），发布构建跳过。配置方法见 docs/RELEASING.md。"
          fi

      - name: 工具链诊断（打印环境事实与 Gradle 配置结果）
        run: |
          set -uo pipefail
          echo "===== 环境 ====="
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-未设置}"
          java -version 2>&1 | head -2
          flutter --version
          echo "----- 已安装的 platforms -----"
          ls "${ANDROID_HOME:-/nonexistent}/platforms" 2>&1 || true
          echo "----- 已安装的 build-tools -----"
          ls "${ANDROID_HOME:-/nonexistent}/build-tools" 2>&1 || true

          flutter pub get

          echo "===== Gradle 配置（触发所有子项目求值）====="
          cd android
          ./gradlew projects --stacktrace 2>&1 | tail -60 || true
          echo "===== 各项目 compileSdkVersion ====="
          ./gradlew -q flutterBuildDebug 2>/dev/null || true

      - name: 诊断结论
        run: |
          echo "以上日志用于确认：Gradle wrapper 版本、AGP 版本、JDK 版本、"
          echo "以及 :gal 项目的 compileSdkVersion 是否被正确解析。"
          echo "TOOLCHAIN_DIAGNOSTICS_DONE"

  build-and-release:
    needs: preflight
    # 没有签名 secrets 就不构建：必然失败的构建只会制造一次看不懂的红叉。
    if: needs.preflight.outputs.has_secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.0
          channel: stable
          cache: true

      - name: 还原签名密钥
        # 四个 Secret：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
        # 密钥本体永不入库（android/.gitignore 已忽略 *.jks 与 key.properties）。
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          test -s android/release.jks || { echo "密钥文件为空：请检查 KEYSTORE_BASE64"; exit 1; }
          cat > android/key.properties <<EOF
          storeFile=../release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Pub get
        run: flutter pub get

      - name: Analyze / Test
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: 安装编译所需的 Android SDK 平台
        # 保险丝：app 与插件项目都用 compileSdk 36，runner 通常已带该平台
        # （实测已装 android-34/35/36/37），装了就是个快速空操作。
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          ls "${ANDROID_HOME}/platforms"

      - name: 构建（arm64 专用包 + 双 ABI 通用包）
        # 不加 --target-platform 会把 armeabi-v7a 一起打进通用包（38MB → 56MB），
        # 与 README 声明的体积不符——这条参数是发布正确性的一部分。
        #
        # Play 版额外带编译期开关：站点预置（模板/默认域名/探测捷径）整体置空。
        run: |
          set -euo pipefail
          # --split-debug-info：把调试符号从 libapp.so 里挪出去（实测 19.6MB → 18.5MB，
          # 符号 3.76MB 单独留存）。**必须同时把符号归档**：去掉之后崩溃栈会变成
          # 无符号地址，而应用本身有「导出诊断日志」功能，没有符号等于白给用户。
          ARGS=(--release --target-platform android-arm64,android-x64 --stacktrace
                --split-debug-info=build/symbols)
          if [ "${{ inputs.play_build }}" = "true" ]; then
            echo '按 Play 版构建（零预置）'
            ARGS+=(--dart-define=boorunova.play=true)
          fi
          flutter build apk "${ARGS[@]}"
          if [ "${{ inputs.play_build }}" = "true" ]; then
            # Play 只收 AAB。splits.abi 只影响 APK 输出，对 AAB 无害：
            # AAB 里会包含全部 ABI，由 Play 按设备切分（这正是它该有的形态）。
            flutter build appbundle --release \
              --split-debug-info=build/symbols \
              --dart-define=boorunova.play=true
          fi

      - name: 校验装机清单（对发布包本身）
        # 权威断言：对象是打包进 APK 的清单，不是中间产物
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          AAPT2=$(ls -d "${ANDROID_HOME}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n1)
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/manifest.txt
          grep -q 'allowBackup(0x01010280)=false' /tmp/manifest.txt
          ! grep -q 'REQUEST_INSTALL_PACKAGES' /tmp/manifest.txt
          ! grep -q 'POST_NOTIFICATIONS' /tmp/manifest.txt
          grep -A3 'READ_EXTERNAL_STORAGE' /tmp/manifest.txt | grep -q 'maxSdkVersion'
          echo "装机清单断言通过"

      - name: 断言签名证书
        # 证书指纹写死：用错密钥（例如 debug 签名或新 keystore）必须当场失败，
        # 而不是等用户装上后 INSTALL_FAILED_UPDATE_INCOMPATIBLE。
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          CERT=$(apksigner verify --print-certs "$APK" | grep 'certificate SHA-256 digest' | head -n1 | awk '{print $NF}')
          echo "signer cert sha256: $CERT"
          EXPECTED="5687a29420f6e278faae3ff97e420ce1adc5517d8b5a6cf759995f38c681f3cd"
          [ "$(echo "$CERT" | tr 'A-F' 'a-f')" = "$EXPECTED" ] || {
            echo "签名证书与线上不一致，拒绝发布"; exit 1; }

      - name: Play 版零预置字节级断言
        # 权威口径：对**产物**断言，不是对源码。AOT 会把常量折叠后的死分支
        # 连同字符串一起摇掉，所以 Play 包里不应出现任何站点域名。
        # APK 与 AAB（上架用的那个）都要查。
        if: ${{ inputs.play_build == 'true' }}
        run: |
          set -euo pipefail
          bash tool/check_play_bytecode.sh build/app/outputs/flutter-apk/app-release.apk
          bash tool/check_play_bytecode.sh build/app/outputs/bundle/release/app-release.aab

      - name: 归档调试符号
        # 符号与这次构建一一对应，丢了就没法把用户的崩溃栈还原成可读位置。
        run: |
          set -euo pipefail
          ls -la build/symbols
          tar -czf build/symbols.tar.gz -C build symbols

      - name: 生成校验和
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-arm64-v8a-release.apk app-release.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # tag 触发时 ref_name 就是 tag；手动触发时必须用输入值，
          # 不能用 ref_name（那是分支名）。
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in
            v*) ;;
            *) echo "::error::tag 必须以 v 开头（收到：$TAG）"; exit 1 ;;
          esac
          ASSETS=(
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
            # 调试符号：用户导出的诊断日志要靠它才能还原成可读栈
            build/symbols.tar.gz
          )
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG 已存在：补传并覆盖资产（重跑场景）"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "BooruNova $TAG" \
              --latest \
              --generate-notes \
              "${ASSETS[@]}"
          fi
