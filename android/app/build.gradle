def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// 「有没有可用的正式签名」的唯一判据。所有签名决策都走这个布尔量，
// 不再各处 `containsKey('keyAlias')` 各判一次。
def hasReleaseKeystore = keystoreProperties.containsKey('keyAlias') &&
        keystoreProperties.containsKey('storeFile')

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

// 版本号只有一个真相来源：pubspec.yaml（flutter 工具在每次构建前把它写进
// local.properties）。这里不再回落到 '1'/'1.0'——回落会让版本号静默变成
// 1.0（对 Gradle 直呼、local.properties 陈旧或手改过的场景），而 versionCode
// 只增不减是 Android 的硬约束，写错一次就发不出去。
def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null || flutterVersionCode.trim() == '') {
    throw new GradleException(
        "缺少 flutter.versionCode：请用 `flutter build` 触发构建（版本号取自 pubspec.yaml），" +
        "不要直接调用 gradle。")
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null || flutterVersionName.trim() == '') {
    throw new GradleException(
        "缺少 flutter.versionName：请用 `flutter build` 触发构建（版本号取自 pubspec.yaml）。")
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    namespace "com.boorunova.app"
    compileSdk 36
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.boorunova.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        // 与 README、banner、应用介绍声明的 Android 8.0+ 保持一致，
        // 避免文档比实现更宽松（或更严格）而对不上。
        minSdkVersion 26
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // 只保留应用真正提供的语言资源。
        //
        // 不加这一行，AGP 会把 androidx / 各插件里带的上百种 locale 资源
        // 全打进 APK（res/values-xx 与 strings 的多语言变体），体积白白
        // 多出几 MB，而应用只支持中英两种界面语言。
        resourceConfigurations += ['en', 'zh']
    }

    // ABI 策略：产出 arm64 专用包与 universal 通用包。
    //
    // universal 覆盖 arm64-v8a + x86_64（约 37.7 MB），供模拟器和少数
    // x86_64 设备使用；arm64 专用包约 18 MB，是绝大多数真机的选择。
    // 两者相加比单个 universal 更省——用户通常只需要其中一个。
    //
    // 这里不能用 defaultConfig.ndk.abiFilters：Gradle 明确禁止
    // abiFilters 与 splits.abi 同时存在，配置其一会让构建直接失败。
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            include 'x86_64'
            universalApk true
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            if (hasReleaseKeystore) {
               signingConfig signingConfigs.release
            }
        }
        profile {
            if (hasReleaseKeystore) {
               signingConfig signingConfigs.release
            }
        }
        release {
            // 缺 key.properties 时**不再静默降级**：此前 release 分支只是
            // `if (有密钥) 用正式签名`，条件为假就悄悄用 debug 签名出包，
            // 老用户升级会直接 INSTALL_FAILED_UPDATE_INCOMPATIBLE。
            // 现在由下面的 taskGraph 守卫在构建 release 时硬失败。
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// 只在真的要构建 release 产物时才校验签名密钥：debug 构建不需要 keystore，
// 不该被这条守卫挡住。放在 taskGraph 里而不是配置期 throw，就是为了这个区分。
gradle.taskGraph.whenReady { graph ->
    if (!hasReleaseKeystore) {
        def releaseTasks = graph.allTasks.findAll {
            it.name.toLowerCase().contains('release')
        }
        if (!releaseTasks.isEmpty()) {
            throw new GradleException(
                "缺少 android/key.properties（或其中的 keyAlias/storeFile）：" +
                "拒绝产出 debug 签名的 release 包。请先恢复正式密钥与 key.properties，" +
                "见 docs/RELEASING.md。")
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
