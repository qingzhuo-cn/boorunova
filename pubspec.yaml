name: boorunova
description: A booru client for Android
publish_to: "none"
version: 1.2.2+5

environment:
  sdk: ">=3.0.3 <4.0.0"
  flutter: ">=3.10.4"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.16.0
  connectivity_plus: ^6.0.0
  crypto: ^3.0.5
  dio: ^5.0.0
  equatable: ^2.0.5
  extended_image: ^8.2.0
  gal: ^2.3.3
  video_player: ^2.8.0
  flutter_displaymode: ^0.6.0
  flutter_riverpod: ^2.1.1
  go_router: ^14.0.0
  hive_ce: ^2.12.0
  file_picker: ^8.0.0
  path_provider: ^2.0.11
  permission_handler: ^11.3.1
  share_plus: ^9.0.0
  shimmer: ^3.0.0
  uuid: ^4.5.1
  flutter_speed_dial: ^7.0.0
  flutter_staggered_grid_view: ^0.7.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
